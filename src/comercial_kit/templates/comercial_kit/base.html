{% load static %}<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Navarino | Servicios Comerciales{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'comercial_kit/marca/navarino-favicon.svg' %}">
  <script>
    /* Tema Día por defecto; aplica la preferencia guardada antes de pintar. */
    try {
      var nvTema = window.localStorage.getItem("nv-theme");
      if (nvTema === "nocturno" || nvTema === "auto") document.documentElement.setAttribute("data-theme", nvTema);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{% static 'comercial_kit/css/navarino-tokens.css' %}">
  <link rel="stylesheet" href="{% static 'comercial_kit/css/navarino-componentes.css' %}">
  <script src="{% static 'comercial_kit/js/navarino-tema.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="nv-header nav-header">
    <div class="nv-header__inner">
      <a href="/" class="nv-logo" aria-label="Navarino, inicio">
        <img class="nv-logo-positivo" src="{% static 'comercial_kit/marca/navarino-logo-positivo.svg' %}" alt="Navarino" width="121" height="46">
        <img class="nv-logo-negativo" src="{% static 'comercial_kit/marca/navarino-logo-negativo.svg' %}" alt="Navarino" width="140" height="65">
      </a>
      <nav class="nv-topnav nav-links" aria-label="Principal">
        {% block nav_links %}{% endblock %}
      </nav>
      <div class="nv-header__end">
        <button type="button" class="nv-theme-toggle" data-nv-theme-toggle aria-pressed="false">
          <svg class="nv-icon nv-theme-toggle__nocturno" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
          <svg class="nv-icon nv-theme-toggle__dia" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Tema nocturno</span>
        </button>
      </div>
    </div>
  </header>

  <main class="nv-container nav-container" id="contenido">
    {% block content %}{% endblock %}
  </main>

  <footer class="nv-footer nav-footer">
    <div class="nv-footer__inner">
      {% block footer %}<span>Navarino Servicios Comerciales © 2026</span>{% endblock %}
    </div>
  </footer>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
