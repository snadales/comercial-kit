{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Navarino | Servicios Comerciales{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'comercial_kit/css/navarino_admin.css' %}">
  <style>
    :root {
      --nav-surface: #0A1118;
      --nav-surface-raised: #1A2531;
      --nav-ink: #E2E8F0;
      --nav-ink-muted: #8A9AA8;
      --nav-line: #2A3846;
      --nav-line-strong: #8A9AA8;
      --nav-accent: #E65C00;
      --nav-accent-deep: #B84A00;
      --nav-on-accent: #FFFFFF;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--nav-surface);
      color: var(--nav-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    header.nav-header {
      background-color: var(--nav-surface-raised);
      border-bottom: 1px solid var(--nav-line);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header.nav-header img.logo {
      height: 36px;
      width: auto;
    }
    main.nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    footer.nav-footer {
      border-top: 1px solid var(--nav-line);
      padding: 20px 24px;
      text-align: center;
      color: var(--nav-ink-muted);
      font-size: 13px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="nav-header">
    <div class="brand">
      <a href="/">
        <img src="/marca-navarino/navarino-logo-negativo.svg"
             onerror="this.onerror=null;this.src='{% static 'comercial_kit/svg/navarino-logo-negativo.svg' %}';"
             alt="Navarino"
             class="logo">
      </a>
    </div>
    <nav class="nav-links">
      {% block nav_links %}{% endblock %}
    </nav>
  </header>

  <main class="nav-container">
    {% block content %}{% endblock %}
  </main>

  <footer class="nav-footer">
    {% block footer %}Navarino Servicios Comerciales &copy; 2026{% endblock %}
  </footer>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
