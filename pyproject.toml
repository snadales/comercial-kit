[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comercial-kit"
version = "1.0.0"
description = "Estándar común K1–K7 para servicios comerciales Navarino (Precios y Promociones)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sebastián Nadales" }]
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.14.0",
    "drf-spectacular>=0.27.0",
    "django-simple-history>=3.5.0",
    "opentelemetry-api>=1.20.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "coverage>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comercial_kit = [
    "templates/**/*.html",
    "static/**/*.css",
    "static/**/*.svg",
]
