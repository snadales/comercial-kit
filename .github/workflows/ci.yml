name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: [self-hosted, zbook]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[dev]"

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src:tests coverage run -m pytest --ds=tests.test_settings
          coverage report -m --fail-under=80
