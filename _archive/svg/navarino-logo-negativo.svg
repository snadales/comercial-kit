    <!-- Hito Naranja (#E65C00) sobre cumbre central -->
    <rect x="34" y="2" width="6" height="12" rx="1" fill="#E65C00" />
    <!-- Montaña de 3 cumbres trazo pincel en Niebla (#E2E8F0) -->
    <path d="M 2 42 Q 18 20 25 24 Q 30 26 37 14 Q 44 26 49 24 Q 56 20 72 42 Q 48 34 37 36 Q 26 34 2 42 Z" fill="#E2E8F0" />
  </g>
  <!-- Texto NAVARINO en niebla (#E2E8F0) -->
  <text x="100" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="4" fill="#E2E8F0">NAVARINO</text>
  <text x="102" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" letter-spacing="2" fill="#8A9AA8">SERVICIOS COMERCIALES</text>
</svg>
